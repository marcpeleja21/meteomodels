name: Webcam Snapshot

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 min (GitHub minimum); loop inside captures every 30s
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Capture and upload every 30s for ~4.5 min
        run: |
          for i in $(seq 1 9); do
            echo "=== Snapshot $i/9 ==="
            rm -f snap.jpg
            ffmpeg -rtsp_transport tcp \
              -i "${{ secrets.WEBCAM_RTSP_URL }}" \
              -vf scale=1280:-1 -frames:v 1 -update 1 -q:v 3 -y snap.jpg \
            && curl -sf -X PUT \
              "https://rurgtrkiuoatgezhrpqk.supabase.co/storage/v1/object/webcam/latest.jpg" \
              -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
              -H "Content-Type: image/jpeg" \
              -H "Cache-Control: no-store" \
              -H "x-upsert: true" \
              --data-binary @snap.jpg \
            && echo "Snapshot $i OK" \
            || echo "Snapshot $i FAILED"
            [ "$i" -lt 9 ] && sleep 30 || true
          done
